- id: editor-nvim
  name: Neovim state
  scope: user
  type: paths
  min_age_days: 30
  paths:
    - ~/.cache/nvim/**
    - ~/.local/state/nvim/log
    - ~/.local/state/nvim/*.log
    - ~/.local/state/nvim/log/**
    - ~/.local/state/nvim/swap/**
    - ~/.local/state/nvim/undo/**
  running_processes: [nvim]
  tags: [editor]
