- id: browser-firefox
  name: Firefox cache
  scope: user
  type: paths
  min_age_days: 7
  paths:
    - ~/.cache/mozilla/firefox/*/cache2/**
    - ~/.cache/mozilla/firefox/*/startupCache/**
    - ~/.cache/mozilla/firefox/*/OfflineCache/**
    - ~/.cache/mozilla/firefox/*/thumbnails/**
    - ~/.cache/mozilla/firefox/*/shader-cache/**
    - ~/.cache/mozilla/firefox/*/jumpListCache/**
  running_processes: [firefox, firefox-bin, firefox-esr]
  tags: [browser]
- id: browser-chromium
  name: Chromium-family cache
  scope: user
  type: paths
  min_age_days: 7
  paths:
    - ~/.cache/google-chrome/*/Cache/**
    - '~/.cache/google-chrome/*/Code Cache/**'
    - ~/.cache/chromium/*/Cache/**
    - '~/.cache/chromium/*/Code Cache/**'
    - ~/.cache/microsoft-edge/*/Cache/**
    - '~/.cache/microsoft-edge/*/Code Cache/**'
    - ~/.cache/BraveSoftware/Brave-Browser/*/Cache/**
    - '~/.cache/BraveSoftware/Brave-Browser/*/Code Cache/**'
    - ~/.cache/vivaldi/*/Cache/**
    - '~/.cache/vivaldi/*/Code Cache/**'
    - ~/.config/google-chrome/*/GPUCache/**
    - '~/.config/google-chrome/*/Code Cache/**'
    - '~/.config/google-chrome/*/Service Worker/CacheStorage/**'
    - '~/.config/google-chrome/*/Service Worker/ScriptCache/**'
    - ~/.config/google-chrome/GrShaderCache/**
    - ~/.config/google-chrome/ShaderCache/**
    - ~/.config/google-chrome/GraphiteDawnCache/**
    - ~/.config/google-chrome/DawnWebGPUCache/**
    - ~/.config/google-chrome/DawnGraphiteCache/**
    - ~/.config/chromium/*/GPUCache/**
    - '~/.config/chromium/*/Code Cache/**'
    - '~/.config/chromium/*/Service Worker/CacheStorage/**'
    - '~/.config/chromium/*/Service Worker/ScriptCache/**'
    - ~/.config/chromium/GrShaderCache/**
    - ~/.config/chromium/ShaderCache/**
    - ~/.config/chromium/GraphiteDawnCache/**
    - ~/.config/chromium/DawnWebGPUCache/**
    - ~/.config/chromium/DawnGraphiteCache/**
    - ~/.config/microsoft-edge/*/GPUCache/**
    - '~/.config/microsoft-edge/*/Code Cache/**'
    - '~/.config/microsoft-edge/*/Service Worker/CacheStorage/**'
    - '~/.config/microsoft-edge/*/Service Worker/ScriptCache/**'
    - ~/.config/microsoft-edge/GrShaderCache/**
    - ~/.config/microsoft-edge/ShaderCache/**
    - ~/.config/microsoft-edge/GraphiteDawnCache/**
    - ~/.config/microsoft-edge/DawnWebGPUCache/**
    - ~/.config/microsoft-edge/DawnGraphiteCache/**
    - ~/.config/BraveSoftware/Brave-Browser/*/GPUCache/**
    - '~/.config/BraveSoftware/Brave-Browser/*/Code Cache/**'
    - '~/.config/BraveSoftware/Brave-Browser/*/Service Worker/CacheStorage/**'
    - '~/.config/BraveSoftware/Brave-Browser/*/Service Worker/ScriptCache/**'
    - ~/.config/BraveSoftware/Brave-Browser/GrShaderCache/**
    - ~/.config/BraveSoftware/Brave-Browser/ShaderCache/**
    - ~/.config/BraveSoftware/Brave-Browser/GraphiteDawnCache/**
    - ~/.config/BraveSoftware/Brave-Browser/DawnWebGPUCache/**
    - ~/.config/BraveSoftware/Brave-Browser/DawnGraphiteCache/**
    - ~/.config/vivaldi/*/GPUCache/**
    - '~/.config/vivaldi/*/Code Cache/**'
    - '~/.config/vivaldi/*/Service Worker/CacheStorage/**'
    - '~/.config/vivaldi/*/Service Worker/ScriptCache/**'
    - ~/.config/vivaldi/GrShaderCache/**
    - ~/.config/vivaldi/ShaderCache/**
    - ~/.config/vivaldi/GraphiteDawnCache/**
    - ~/.config/vivaldi/DawnWebGPUCache/**
    - ~/.config/vivaldi/DawnGraphiteCache/**
  running_processes: [chrome, google-chrome, chromium, chromium-browser, msedge, microsoft-edge, brave, brave-browser, vivaldi-bin]
  tags: [browser]
- id: browser-puppeteer
  name: Puppeteer browser cache
  description: Stale Puppeteer-managed Chrome downloads; the age filter keeps the recently fetched version
  scope: user
  type: paths
  min_age_days: 30
  paths:
    - ~/.cache/puppeteer
  tags: [browser, test]
